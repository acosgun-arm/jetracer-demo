name: Headless CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libopencv-dev \
            ninja-build

      - name: Install Python test dependencies
        run: |
          python -m pip install \
            "numpy>=1.26" \
            "Pillow>=10" \
            "pybind11>=2.12"

      - name: Configure headless build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DJETRACER_SIM_BUILD_NATIVE_CLI=OFF \
            -DJETRACER_SIM_BUILD_PYTHON=ON \
            -DJETRACER_SIM_BUILD_TESTS=ON \
            -DPython_EXECUTABLE="$(command -v python)" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build-ci --parallel 2

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure --timeout 180
